<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NebNotes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo" id="logoBtn" title="Ir para Dashboard">
          <i class="fas fa-cloud"></i>
          <span>NebNotes</span>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" id="btnNewFolder" title="Nova pasta">
            <i class="fas fa-folder-plus"></i>
          </button>
          <button class="icon-btn" id="btnNewNote" title="Nova nota">
            <i class="fas fa-file-circle-plus"></i>
          </button>
        </div>
      </div>

      <div class="tree-container" id="treeContainer">
        <!-- Tree rendered by JS -->
      </div>

      <div class="sidebar-footer">
        <button class="icon-btn" id="btnSettings" title="Configurações">
          <i class="fas fa-gear"></i>
        </button>
        <button class="icon-btn" id="btnDashboard" title="Dashboard">
          <i class="fas fa-house"></i>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" id="breadcrumbs">
        <span class="crumb" data-id="dashboard">Início</span>
      </nav>

      <!-- DASHBOARD VIEW -->
      <section class="view dashboard-view" id="dashboardView">
        <div class="dashboard-header">
          <h1>Bem-vindo ao NebNotes</h1>
          <p class="subtitle">Um lugar para guardar, organizar e consultar tudo que você aprende.</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <i class="fas fa-folder"></i>
            <div>
              <span class="stat-value" id="statFolders">0</span>
              <span class="stat-label">Pastas</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-file-lines"></i>
            <div>
              <span class="stat-value" id="statNotes">0</span>
              <span class="stat-label">Notas</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-layer-group"></i>
            <div>
              <span class="stat-value" id="statTypes">0</span>
              <span class="stat-label">Tipos usados</span>
            </div>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="dash-section">
            <h2><i class="fas fa-clock-rotate-left"></i> Notas recentes</h2>
            <div class="recent-list" id="recentNotes">
              <!-- filled by JS -->
            </div>
          </div>
          <div class="dash-section">
            <h2><i class="fas fa-folder-tree"></i> Pastas principais</h2>
            <div class="folders-list" id="rootFolders">
              <!-- filled by JS -->
            </div>
          </div>
        </div>

        <div class="quick-actions">
          <button class="btn btn-primary" id="dashNewNote">
            <i class="fas fa-plus"></i> Nova nota
          </button>
          <button class="btn btn-secondary" id="dashNewFolder">
            <i class="fas fa-folder-plus"></i> Nova pasta
          </button>
        </div>
      </section>

      <!-- NOTE EDITOR VIEW -->
      <section class="view editor-view hidden" id="editorView">
        <div class="editor-header">
          <div class="note-meta">
            <button class="type-badge" id="noteTypeBtn" title="Alterar tipo">
              <i class="fas fa-file-lines"></i>
              <span>Texto</span>
            </button>
            <input type="text" id="noteTitle" class="note-title-input" placeholder="Título da nota" maxlength="120">
          </div>
          <div class="editor-actions">
            <button class="btn btn-ghost" id="btnSaveNote" title="Salvar (Ctrl+S)">
              <i class="fas fa-floppy-disk"></i> Salvar
            </button>
          </div>
        </div>

        <div class="editor-body">
          <div class="editor-toolbar">
            <button class="tb-btn" data-md="bold" title="Negrito"><i class="fas fa-bold"></i></button>
            <button class="tb-btn" data-md="italic" title="Itálico"><i class="fas fa-italic"></i></button>
            <button class="tb-btn" data-md="code" title="Código inline"><i class="fas fa-code"></i></button>
            <button class="tb-btn" data-md="h2" title="Título"><i class="fas fa-heading"></i></button>
            <button class="tb-btn" data-md="list" title="Lista"><i class="fas fa-list-ul"></i></button>
            <button class="tb-btn" data-md="check" title="Checklist"><i class="fas fa-list-check"></i></button>
            <button class="tb-btn" data-md="quote" title="Citação"><i class="fas fa-quote-left"></i></button>
            <button class="tb-btn" data-md="codeblock" title="Bloco de código"><i class="fas fa-file-code"></i></button>
            <span class="tb-sep"></span>
            <button class="tb-btn" id="btnTogglePreview" title="Alternar preview">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <div class="editor-panes">
            <textarea id="noteContent" class="note-content" placeholder="Escreva suas anotações aqui...&#10;&#10;Suporta Markdown:&#10;# Título&#10;**negrito** _itálico_ `código`&#10;- lista&#10;```js&#10;código&#10;```" spellcheck="true"></textarea>
            <div id="notePreview" class="note-preview hidden"></div>
          </div>
        </div>
      </section>

      <!-- FOLDER VIEW (when selecting a folder) -->
      <section class="view folder-view hidden" id="folderView">
        <div class="folder-header">
          <div class="folder-title-row">
            <i class="fas fa-folder-open folder-icon-large" id="folderIconDisplay"></i>
            <h1 id="folderTitle">Pasta</h1>
          </div>
          <div class="folder-actions">
            <button class="btn btn-secondary" id="btnFolderNewNote">
              <i class="fas fa-file-circle-plus"></i> Nova nota
            </button>
            <button class="btn btn-secondary" id="btnFolderNewSubfolder">
              <i class="fas fa-folder-plus"></i> Subpasta
            </button>
          </div>
        </div>
        <div class="folder-content" id="folderContent">
          <!-- notes and subfolders -->
        </div>
      </section>
    </main>
  </div>

  <!-- CONTEXT MENU -->
  <div class="context-menu hidden" id="contextMenu">
    <!-- filled dynamically -->
  </div>

  <!-- MODALS -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Título</h3>
        <button class="icon-btn" id="modalClose"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- TYPE / ICON PICKER -->
  <div class="picker-overlay hidden" id="pickerOverlay">
    <div class="picker" id="picker">
      <h4 id="pickerTitle">Escolher tipo</h4>
      <div class="picker-grid" id="pickerGrid"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
