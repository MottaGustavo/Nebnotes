[package]
name = "nebnotes"
version = "1.0.0"
description = "NebNotes - organização pessoal de conhecimento"
authors = ["Gustavo"]
edition = "2021"

[lib]
name = "nebnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
